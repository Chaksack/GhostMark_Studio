name: Terraform Validate & Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
  # Push validation is handled by the unified pipeline to show a single graph

jobs:
  validate-plan-staging:
    name: Staging - fmt/validate/plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (staging)
        run: terraform plan -input=false -out=tfplan

      - name: Notify (staging failure)
        if: ${{ always() && failure() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":x: Terraform validate/plan failed for staging in *${{ github.repository }}* on ${{ github.ref }} — run ${{ github.run_id }}"
            }

  validate-plan-prod:
    name: Prod - fmt/validate/plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/prod
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (prod)
        run: terraform plan -input=false -out=tfplan

      - name: Notify (prod failure)
        if: ${{ always() && failure() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":x: Terraform validate/plan failed for prod in *${{ github.repository }}* on ${{ github.ref }} — run ${{ github.run_id }}"
            }
