name: Terraform Apply (prod)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply-prod.yml'

jobs:
  apply-prod:
    name: Apply to Production
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: terraform-prod-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/envs/prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Notify (pre-plan)
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":terraform: Production plan starting in *${{ github.repository }}* by *${{ github.actor }}* (@ ${{ github.ref_name }})"
            }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (prod)
        run: terraform plan -input=false -out=tfplan

      - name: Require manual confirmation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ secrets.PROD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Approve Terraform Apply to Production"
          issue-body: "Please review the Terraform plan and approve to apply to production."

      - name: Notify (awaiting approval)
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":hourglass_flowing_sand: Awaiting manual approval to apply production plan for *${{ github.repository }}* (@ ${{ github.ref_name }})"
            }

      - name: Terraform apply (prod)
        run: terraform apply -input=false -auto-approve tfplan || terraform apply -input=false -auto-approve

      - name: Notify (apply success)
        if: ${{ success() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":white_check_mark: Production apply completed successfully for *${{ github.repository }}* (@ ${{ github.ref_name }})"
            }

      - name: Notify (apply failure)
        if: ${{ failure() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":x: Production apply failed for *${{ github.repository }}* (@ ${{ github.ref_name }}) — run ${{ github.run_id }}"
            }
