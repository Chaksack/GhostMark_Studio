name: Terraform Apply (staging)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply-staging.yml'

jobs:
  apply-staging:
    name: Apply to Staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-staging-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: terraform/envs/staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Notify (pre-apply)
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":terraform: Staging apply starting in *${{ github.repository }}* by *${{ github.actor }}* (@ ${{ github.ref_name }})"
            }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply (staging)
        run: terraform apply -auto-approve -input=false

      - name: Notify (apply success)
        if: ${{ success() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":white_check_mark: Staging apply completed successfully for *${{ github.repository }}* (@ ${{ github.ref_name }})"
            }

      - name: Notify (apply failure)
        if: ${{ failure() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":x: Staging apply failed for *${{ github.repository }}* (@ ${{ github.ref_name }}) — run ${{ github.run_id }}"
            }
