            - paragraph [ref=e160]: One important caveat
            - heading "Custom orders are non-returnable." [level=2] [ref=e161]
            - paragraph [ref=e162]:
              - text: Anything printed, embroidered or finished to your spec is made for you and you alone — we can't restock it. We mitigate this by sending a physical sample for sign-off before any custom run goes to press. If something arrives faulty or doesn't match the approved sample,
              - link "tell us" [ref=e163] [cursor=pointer]:
