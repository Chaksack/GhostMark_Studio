# Railway/Nixpacks configuration for the storefront service
# Forces pnpm via Corepack and uses the existing package.json scripts

[phases.setup]
  nixPkgs = ["nodejs"]

[phases.install]
  cmds = [
    "export COREPACK_ENABLE_DOWNLOAD_PROMPT=0",
    "corepack enable",
    "corepack prepare pnpm@9.15.4 --activate",
    # Avoid failing if a local pnpm-lock.yaml isn't present in this subfolder
    "if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile --prefer-offline; else pnpm install --prefer-offline; fi"
  ]

[phases.build]
  cmds = [
    "pnpm run build"
  ]

[start]
  cmd = "pnpm start"
