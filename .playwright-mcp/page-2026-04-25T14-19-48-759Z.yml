              - heading "Branded merch" [level=3] [ref=e113]
              - paragraph [ref=e114]: Tote bags, ceramic mugs, enamel pins, hardcover notebooks. We help small brands build a tight set of objects that feel like the brand itself.
            - article [ref=e115]:
              - generic "Image placeholder" [ref=e118]: Image — replace with real photography
              - heading "On-demand print" [level=3] [ref=e119]
              - paragraph [ref=e120]: Posters, zines and lookbooks printed sheet by sheet. No minimums, no warehouses — your customer orders, we print and ship the same week.
