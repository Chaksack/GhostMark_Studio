              - heading "Carbon-neutral shipping" [level=3] [ref=e95]
              - paragraph [ref=e96]: Every order leaves our workshops with its freight emissions measured, offset and verified — not estimated. We pay the difference, you pay nothing extra.
              - paragraph [ref=e97]: Offsets verified by Climate Neutral, audited annually since 2019.
            - article [ref=e98]:
              - heading "GOTS-certified cotton" [level=3] [ref=e99]
              - paragraph [ref=e100]: All cotton garments — tees, crewnecks, totes — are spun from organically grown, GOTS-certified fibre. No pesticides, no fluorescent brighteners, no shortcuts.
              - paragraph [ref=e101]: Global Organic Textile Standard, certificate CU-1042918, refreshed yearly.
            - article [ref=e102]:
              - heading "Recycled inks and packaging" [level=3] [ref=e103]
              - paragraph [ref=e104]: We print with reclaimed water-based inks and ship in 100% post-consumer recycled mailers. Even the tape is paper. Even the labels compost.
              - paragraph [ref=e105]: Mailers and tape FSC-certified; inks meet OEKO-TEX Eco Passport.
            - article [ref=e106]:
              - heading "1% for the planet" [level=3] [ref=e107]
              - paragraph [ref=e108]: One percent of every order — not profit, revenue — goes to vetted environmental nonprofits chosen by the studio team each quarter.
              - paragraph [ref=e109]: Approved member since 2021. Beneficiary list published each January.
