name: Terraform Destroy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (staging|prod)"
        required: true
        default: "staging"
      confirm:
        description: "Type YES to confirm destroy"
        required: true
        default: "NO"

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: ${{ github.event.inputs.environment == 'prod' && 'terraform/envs/prod' || 'terraform/envs/staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Notify (pre-destroy)
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":warning: Terraform destroy starting for environment: ${{ github.event.inputs.environment }} by ${{ github.actor }} in ${{ github.repository }}@${{ github.ref }}"
            }

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false

      - name: Notify (post-destroy)
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":white_check_mark: Terraform destroy completed for environment: ${{ github.event.inputs.environment }}"
            }
