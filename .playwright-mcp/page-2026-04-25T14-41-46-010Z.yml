        - region "Returns, made simple." [ref=e74]:
          - generic [ref=e75]:
            - paragraph [ref=e76]: Returns & refunds
            - heading "Returns, made simple." [level=1] [ref=e77]:
              - text: Returns,
              - text: made simple.
            - paragraph [ref=e78]: Free returns on every stocked style for 30 days. No restocking fees, no hoops to jump through. Custom orders are a different story — there's a note about that further down.
        - region "30 days, no questions, free return label." [ref=e79]:
          - generic [ref=e81]:
            - paragraph [ref=e82]: Our promise
            - heading "30 days, no questions, free return label." [level=2] [ref=e83]
            - paragraph [ref=e84]: If a stocked piece doesn't fit, doesn't suit, or just isn't what you expected — send it back. We pay the return postage and refund the original total in full.
        - region "Three steps, ten minutes." [ref=e85]:
          - generic [ref=e86]:
            - generic [ref=e87]:
              - paragraph [ref=e88]: How it works
              - heading "Three steps, ten minutes." [level=2] [ref=e89]
            - list [ref=e90]:
              - listitem [ref=e91]:
                - generic [ref=e92]: "01"
                - heading "Request" [level=3] [ref=e93]
                - paragraph [ref=e94]: Sign in to your account, find the order, and click "Start a return". No login? Email returns@ghostmark.studio with your order number.
              - listitem [ref=e95]:
                - generic [ref=e96]: "02"
                - heading "Pack" [level=3] [ref=e97]
                - paragraph [ref=e98]: Fold the item back into its original mailer or any sturdy envelope. Pop the prepaid label inside the package — it's emailed within an hour.
              - listitem [ref=e99]:
                - generic [ref=e100]: "03"
                - heading "Ship" [level=3] [ref=e101]
                - paragraph [ref=e102]: Drop it at any post office or partner pickup point. Tracking is automatic; you'll get an email the moment it lands at the studio.
        - region "What we can and can't take back." [ref=e103]:
          - generic [ref=e104]:
