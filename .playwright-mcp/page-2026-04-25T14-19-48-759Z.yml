              - text: A small studio
              - text: making merch that lasts.
            - paragraph [ref=e79]: GhostMark is a print-on-demand studio for brands who'd rather ship one good thing than a thousand throwaway ones. We screen, embroider and bind in low runs out of three small workshops in Brussels, Berlin and London.
