      - region "Started in a print room, still printing." [ref=e88]:
        - generic [ref=e89]:
          - generic [ref=e90]:
            - paragraph [ref=e91]: Our story
            - heading "Started in a print room, still printing." [level=2] [ref=e92]
          - generic [ref=e93]:
            - paragraph [ref=e94]: We began in 2014 in a converted post office in Brussels with a single four-colour press, two interns and a side-hustle screenprinting tour shirts for friends' bands. Eleven years on, the press is still running, the interns are now studio leads, and the bands have mostly broken up.
            - paragraph [ref=e95]: Today we work with cafes, design studios, indie labels and a few quiet global brands who want their merch to feel handmade rather than mass-produced. We keep runs small on purpose. We use real ink on real fabric. And we still pack each order ourselves, because the unboxing is part of the object.
            - paragraph [ref=e96]: Nothing about the way we make things is fast. That's deliberate.
      - region "Three things, done with full attention." [ref=e97]:
