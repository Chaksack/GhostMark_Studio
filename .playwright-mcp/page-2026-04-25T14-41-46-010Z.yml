          - generic [ref=e140]:
            - generic [ref=e141]:
              - paragraph [ref=e142]: Refund timeline
              - heading "Received → Inspected → Refunded." [level=2] [ref=e143]
            - list [ref=e144]:
              - listitem [ref=e145]:
                - generic [ref=e146]: Stage 01
                - heading "Received" [level=3] [ref=e147]
                - paragraph [ref=e148]: A confirmation email lands the moment your parcel checks in at the studio — usually 2–3 working days after dispatch.
              - listitem [ref=e149]:
                - generic [ref=e150]: Stage 02
                - heading "Inspected" [level=3] [ref=e151]
                - paragraph [ref=e152]: We open and inspect every return inside one working day. Faults, sizing notes and substitutions are logged at this point.
              - listitem [ref=e153]:
                - generic [ref=e154]: Stage 03
                - heading "Refunded" [level=3] [ref=e155]
                - paragraph [ref=e156]: Refunds are issued back to the original payment method. Card refunds typically settle within 3–5 working days; PayPal sooner.
        - region "Custom orders are non-returnable." [ref=e157]:
