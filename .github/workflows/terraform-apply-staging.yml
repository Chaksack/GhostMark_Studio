name: Terraform Apply (staging)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  apply-staging:
    name: Apply to Staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: terraform/envs/staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Notify (pre-apply)
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":terraform: Staging apply starting in *${{ github.repository }}* by *${{ github.actor }}* (@ ${{ github.ref_name }})"
            }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply (staging)
        run: terraform apply -auto-approve -input=false

      - name: Notify (apply success)
        if: ${{ success() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":white_check_mark: Staging apply completed successfully for *${{ github.repository }}* (@ ${{ github.ref_name }})"
            }

      - name: Notify (apply failure)
        if: ${{ failure() && secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":x: Staging apply failed for *${{ github.repository }}* (@ ${{ github.ref_name }}) — run ${{ github.run_id }}"
            }
