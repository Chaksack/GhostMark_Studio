            - paragraph [ref=e151]: When you are interested in finding the best gifts, you will first pass through the hands of our sales staff. This team is made from experienced professionals who are knowledgeable about the promotional products and services we offer. They are trained to work closely with clients to understand their specific needs and requirements, and to help them choose the right corporate gift while providing advice on customisation options.
            - paragraph [ref=e152]: Once you have placed your order, our production team takes over. We work with partners that use state-of-the-art equipment and techniques to produce high-quality customisable gifts that meet your specifications. Whether you need your logo in a specific colour or placed in a certain corner of the gift, our production team will make it happen, as long as it's doable.
