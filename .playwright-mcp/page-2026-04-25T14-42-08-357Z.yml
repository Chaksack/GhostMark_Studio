            - generic [ref=e117]:
              - article [ref=e118]:
                - heading "What are cookies?" [level=2] [ref=e119]
                - paragraph [ref=e120]: Cookies are small text files stored on your device when you visit a website. They're used by almost every site on the modern web to keep you logged in, remember a cart, measure traffic, and personalise content. The cookies we set on ghostmark.studio are described in detail below.
                - paragraph [ref=e121]: We treat cookies the same way we treat the rest of our data practices — as little as possible, transparent about why, and easy to change your mind about.
              - article [ref=e122]:
                - heading "How to manage cookies" [level=2] [ref=e123]
                - paragraph [ref=e124]: You can change your consent at any time using the "Manage preferences" button at the top of this page. You can also block or delete cookies through your browser settings — every modern browser exposes this in its privacy or content settings panel.
                - paragraph [ref=e125]: Blocking essential cookies will break parts of the site (cart, checkout, account). Blocking analytics, functional or marketing cookies will not.
              - article [ref=e126]:
                - heading "Third-party cookies" [level=2] [ref=e127]
                - paragraph [ref=e128]: Some pages embed content from third parties — Stripe (payments), Vimeo (product video), and occasionally a Twitter or Instagram embed. These third parties may set their own cookies governed by their own policies. We list the active ones in our consent banner so you can opt out of each individually.
              - article [ref=e129]:
                - heading "Updates" [level=2] [ref=e130]
                - paragraph [ref=e131]: When we add a new cookie or change how an existing one works, we update this page and refresh the consent banner so you can re-confirm. The "last updated" date at the top of the page tells you when the most recent change happened.
              - article [ref=e132]:
                - heading "Contact" [level=2] [ref=e133]
                - paragraph [ref=e134]: For questions about our cookies policy or to request a copy of the cookies stored against your account, email privacy@ghostmark.studio. We respond within five working days.
