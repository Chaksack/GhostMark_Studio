    - generic [ref=e97]:
      - generic [ref=e100]:
        - heading "B Corp" [level=2] [ref=e101]
        - generic [ref=e102]:
          - paragraph [ref=e103]: We are proud B Corp.
          - paragraph [ref=e104]: Being part of the B Corp community means being part of the change. The B Corp values and criteria serve as a framework in all the decisions that we make.
          - paragraph [ref=e105]: For us being a B Corp does not only mean valuing workers, customers, environment and community as much as profits - but also having strong corporate governance that keeps those values in place. Our decisions have a positive impact on the environment, stakeholders, employees and local communities.
          - paragraph [ref=e106]: We are thrilled to have joined this community of inspiring businesses and even prouder to count many like-minded partners and clients of Merchery as fellow B Corps as well.
          - paragraph [ref=e107]: We are committed to use business as a force for good!
      - generic [ref=e108]:
        - figure:
          - img "Merchery Bcorp certified" [ref=e109]
    - generic [ref=e110]:
      - generic [ref=e113]:
        - heading "Sourcing" [level=2] [ref=e114]
        - generic [ref=e115]:
          - paragraph [ref=e116]: Our mission is to help organisations reduce their environmental footprint by providing customisable & sustainable products for their brand to shine in real life.
          - paragraph [ref=e117]: Each product is sourced mindfully, tracing its value chain back to the raw materials. We want you to be fully informed on where and how the product is made.
          - paragraph [ref=e118]: "Our selection criteria are part of why we exist: in each category we are seeking for the best products, manufactured in the best conditions, and with the lowest environmental impact."
          - paragraph [ref=e119]: We want those products to last. And there is no secret, the first way to do that is to offer products people actually want. Therefore, design is at the core of our selection process.
      - generic [ref=e120]:
        - figure:
          - img "homepage_promoted_block.jpg" [ref=e121]
    - generic [ref=e122]:
      - generic [ref=e125]:
        - heading "1% for the planet" [level=2] [ref=e126]
        - generic [ref=e127]:
          - paragraph [ref=e128]: We are committing to paying our rent for living on the planet. We are taking responsibility for our impact. That’s why we’re part of 1% for the planet. Have you ever heard of it?
          - paragraph [ref=e129]: Founded in 2002 by Yvon Chouinard, founder of Patagonia, and Craig Mathews, founder of Blue Ribbon Flies, 1% for the Planet is a global network of businesses, individuals, and nonprofit organisations working together to protect the planet.
          - paragraph [ref=e130]: Being part of 1% for the Planet means that we’ll donate 1% of our gross sales each year to environmental causes. Whatever the profit. By doing so, we demonstrate our commitment to sustainability and take responsibility for the impact of our actions on the environment.
          - paragraph [ref=e131]: Through their donations, 1% for the Planet members support a wide variety of environmental initiatives, such as protecting forests and oceans, promoting sustainable agriculture and fishing practices, and advocating for climate action.
      - generic [ref=e132]:
        - figure:
          - img "Big image.png" [ref=e133]
    - generic [ref=e134]:
      - generic [ref=e137]:
        - heading "Raw materials" [level=2] [ref=e138]
        - generic [ref=e139]:
          - paragraph [ref=e140]: "In our quest for sustainability, we are opting for materials presenting a reduced environmental impact throughout its entire life cycle: from the extraction of the raw material to its production process, its use and disposal. Here are some of the raw materials we favour."
          - paragraph [ref=e141]: Metals can be sustainable. Recycling stainless steel and aluminium requires up to 95% less energy and emits far lower amount of greenhouse gas than mining and processing it to new metal.
          - paragraph [ref=e142]: We source 100% organic cotton textile. It has the advantage of being a natural, GMO-free fibre that uses less water than standard cotton and which production does not involve the use of chemicals.
          - paragraph [ref=e143]: "Plastic is everywhere in our lives. Unfortunately, while still being a vital asset for humanity, its production requires a lot of energy. About eight percent of the world’s oil is used to make plastic. Though it exists substitutes that require less fossile fuels and reduce the greenhouse gaz emissions: recycled, bio-based, and biodegradable plastics."
      - generic [ref=e144]:
        - figure:
          - img "transparency_fabric.jpg" [ref=e145]
    - generic [ref=e146]:
      - generic [ref=e149]:
        - heading "Transport" [level=2] [ref=e150]
        - generic [ref=e151]:
          - paragraph [ref=e152]: International freight transports are estimated to currently account for around 30% of all transport related CO2 emissions, and more than 7% of global emissions. Analysts forecasted a fourfold increase of trade-related freight transport emission by 2050.
          - paragraph [ref=e153]: For a good part of the products we offer, transport appears to be a significant source of carbon emissions. For long distances, we avoid air shipping and favor slower transportation modes such as train and boat emitting up to 150 times less emissions than planes.
      - generic [ref=e154]:
        - figure:
          - img "transparency_transport.jpg" [ref=e155]
