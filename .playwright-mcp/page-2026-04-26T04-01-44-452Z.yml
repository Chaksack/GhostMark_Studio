              - paragraph [ref=e102]: How we work
              - heading "Brief, sample, production." [level=2] [ref=e103]
              - paragraph [ref=e104]: Three steps, no surprises. We name the inks, the threads and the substrates up front, send a physical sample before any volume is committed, and finish every piece in the workshop closest to where it's heading.
            - list [ref=e105]:
              - listitem [ref=e106]:
                - generic [ref=e107]: "01"
                - heading "Brief" [level=3] [ref=e108]
                - paragraph [ref=e109]: A fifteen-minute call, a shared mood board, a single PDF — whatever's easiest for you. We translate it into a printable spec the same week.
              - listitem [ref=e110]:
                - generic [ref=e111]: "02"
                - heading "Sample" [level=3] [ref=e112]
                - paragraph [ref=e113]: One physical sample, posted to your door, with the inks, threads and substrates we'd run in production. Approve or iterate before any volume is committed.
              - listitem [ref=e114]:
                - generic [ref=e115]: "03"
                - heading "Production" [level=3] [ref=e116]
                - paragraph [ref=e117]: Small runs printed and finished by hand in the workshop closest to your destination market. Folded, polybagged and tracked end-to-end.
