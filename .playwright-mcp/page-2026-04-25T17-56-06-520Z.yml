            - paragraph [ref=e117]: How we work
            - heading "Brief, sample, production." [level=2] [ref=e118]
            - paragraph [ref=e119]: Three steps, no surprises. We name the inks, the threads and the substrates up front, send a physical sample before any volume is committed, and finish every piece in the workshop closest to where it's heading.
          - list [ref=e120]:
            - listitem [ref=e121]:
              - generic [ref=e122]: "01"
              - heading "Brief" [level=3] [ref=e123]
              - paragraph [ref=e124]: A fifteen-minute call, a shared mood board, a single PDF — whatever's easiest for you. We translate it into a printable spec the same week.
            - listitem [ref=e125]:
              - generic [ref=e126]: "02"
              - heading "Sample" [level=3] [ref=e127]
              - paragraph [ref=e128]: One physical sample, posted to your door, with the inks, threads and substrates we'd run in production. Approve or iterate before any volume is committed.
            - listitem [ref=e129]:
              - generic [ref=e130]: "03"
              - heading "Production" [level=3] [ref=e131]
              - paragraph [ref=e132]: Small runs printed and finished by hand in the workshop closest to your destination market. Folded, polybagged and tracked end-to-end.
