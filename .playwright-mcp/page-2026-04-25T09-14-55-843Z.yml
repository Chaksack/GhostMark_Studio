          - generic [ref=e137]:
            - paragraph [ref=e138]: We believe that quality can win over quantity. And we thought that a better sourcing and transparency on where and how our promotional products are made would bring back value to this short term game.
            - paragraph [ref=e139]: That's why we source only thoughtful gifts options. From high-quality leather goods to eco-friendly products, our team of experts carefully selects each item to ensure that they meet our standards of quality and sustainability. We're proud to propose you a catalogue full of top brands and products, with real values & commitment towards both people and planet.
